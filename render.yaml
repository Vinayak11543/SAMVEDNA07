services:
  - type: web
    name: samvedna07-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r api_service/requirements.txt
    startCommand: uvicorn api_service.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"

